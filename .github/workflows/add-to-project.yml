# Copy this file to .github/workflows/add-to-project.yml in EACH student
# repo you want feeding the org board. Three lines need filling in, all
# from the bootstrap-ids.yml run (see SETUP.md step 5): PROJECT_ID and
# TEAM_FIELD_ID are the same for every repo, TEAM_OPTION_ID is this repo's
# team only.
#
# What it does: whenever a new issue is opened in this repo, it's added to
# the org-level project and its "Team" field is set to this repo's team - no
# per-repo GitHub UI clicking required, and no limit on how many repos
# can do this (unlike the built-in "Auto-add to project" workflow, which
# is capped at 1 repo on GitHub Free / 5 on Pro-Team / 20 on Enterprise).
#
# It talks to the project by its fixed IDs rather than looking it up by
# org + project number (gh project --owner ...). That lookup, repeated on
# every issue, is what was tripping GitHub's abuse-detection and showing up
# as a confusing "unknown owner type" error.
#
# One-time setup required before this will work - see SETUP.md.

name: Add issue to org project

on:
  issues:
    types: [opened]

env:
  PROJECT_ID: "PVT_kwDOAsbG9M4BjnSY"          # "PROJECT_ID = PVT_..." from bootstrap-ids.yml - same for every repo
  TEAM_FIELD_ID: "2ebd58b1"    # "TEAM_FIELD_ID = PVTSSF_..." from bootstrap-ids.yml - same for every repo
  TEAM_OPTION_ID: "Lovelace"  # this repo's team's 'option "..." = ...' value from bootstrap-ids.yml

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        id: add
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PROJECT_PAT came through empty in this repo. Add this repo to the org secret's 'Selected repositories' list (SETUP.md step 4), then re-run."
            exit 1
          fi
          ITEM_ID=$(gh api graphql \
            -f query='mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) { item { id } }
            }' \
            -f project="$PROJECT_ID" -f issue="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')
          echo "item_id=$ITEM_ID" >> "$GITHUB_OUTPUT"

      - name: Set the Team field
        # If this fails with an error about the option or field id, the IDs
        # above are stale (e.g. the team option was renamed or recreated) -
        # re-run bootstrap-ids.yml and update them.
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          ITEM_ID: ${{ steps.add.outputs.item_id }}
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project, itemId: $item, fieldId: $field,
                value: {singleSelectOptionId: $option}
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" -f item="$ITEM_ID" \
            -f field="$TEAM_FIELD_ID" -f option="$TEAM_OPTION_ID" > /dev/null
          echo "Added ${{ github.event.issue.html_url }} to the project with its Team set."
